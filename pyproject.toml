[project]
name = "phantom-editor"
version = "0.1.0"
description = "The phantom CLI: tools for making, publishing and tracking YouTube videos"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "google-api-python-client>=2.194.0",
    "google-auth-httplib2>=0.3.1",
    "google-auth-oauthlib>=1.3.1",
    "groq>=1.5.0",
    "instagrapi[video]>=2.16.0",
    "librosa>=1.0.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "numpy>=2.4.6",
    "panns-inference>=0.1.1",
    "pillow>=12.2.0",
    "playwright>=1.58.0",
    "playwright-stealth>=2.0.3",
    "pyautogui>=0.9.54",
    "pygments>=2.20.0",
    "python-dotenv>=1.2.2",
    "python-xlib>=0.33",
    "rapidfuzz>=3.14.5",
    "resend>=2.6.0",
    "scipy>=1.17.1",
    "setuptools<70",
    "soundfile>=0.14.0",
    "tiktok-uploader>=1.2.0",
    "torch>=2.12.1",
    "tqdm>=4.67.3",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true



# The repo is installed into the venv in editable mode, so every top-level folder below is an
# importable package (`python -m projects.current_pipeline`) without touching sys.path.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel]
packages = [
    "agentic", "broll_templates", "browser", "content", "devto", "emails", "hashnode", "ideas",
    "linkedin", "metadata", "projects", "reddit", "review", "shared", "skool", "substack",
    "twitter", "video_editing", "youtube_api",
]
