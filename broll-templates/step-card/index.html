<!doctype html>
<!--
  Step card: a reusable numbered point card ("01 / Step 1 of 4 / <title>").
  Opaque ground, hard cut in and out of a talking head.

  Elastic length: the clip runs for the root's data-duration. Variables can't change it, so
  the render wrapper patches data-duration="..." on #root in a temp copy; nothing else here
  is timed. Fixed entrance (~1.2 s) -> slow push-in hold -> last 6 frames still.

  Theme: `theme` picks the dark or light palette. A colour variable left at its default
  follows the theme; any other value overrides it in both themes.

  Render one card:
    hyperframes render -o card.mp4 --variables '{"number":1,"total":4,"title":"Change weak & reused passwords"}'
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"number","type":"number","label":"Number","default":1,"min":1,"max":99,"step":1},
    {"id":"total","type":"number","label":"Total (for {total} in the label)","default":4,"min":0,"max":99,"step":1},
    {"id":"label","type":"string","label":"Label ({n} = number, {total} = total)","default":"Step {n} of {total}","placeholder":"Red flag #{n}","maxLength":40},
    {"id":"title","type":"string","label":"Title","default":"Change weak & reused passwords","maxLength":80},
    {"id":"theme","type":"enum","label":"Theme","default":"dark","options":[{"value":"dark","label":"Dark"},{"value":"light","label":"Light"}]},
    {"id":"color-ground","type":"color","label":"Background (default follows theme)","default":"#050608"},
    {"id":"color-ink","type":"color","label":"Title (default follows theme)","default":"#f2f4f7"},
    {"id":"color-muted","type":"color","label":"Label (default follows theme)","default":"#8b929c"},
    {"id":"color-accent","type":"color","label":"Number (default follows theme)","default":"#ff2d3d"},
    {"id":"font","type":"enum","label":"Number & title font","default":"Inter","options":[
      {"value":"Inter","label":"Inter"},
      {"value":"Montserrat","label":"Montserrat"},
      {"value":"Outfit","label":"Outfit"},
      {"value":"Poppins","label":"Poppins"},
      {"value":"Nunito","label":"Nunito"},
      {"value":"Roboto","label":"Roboto"},
      {"value":"Oswald","label":"Oswald"},
      {"value":"League Gothic","label":"League Gothic"},
      {"value":"Archivo Black","label":"Archivo Black"},
      {"value":"Playfair Display","label":"Playfair Display"},
      {"value":"EB Garamond","label":"EB Garamond"},
      {"value":"JetBrains Mono","label":"JetBrains Mono"},
      {"value":"Space Mono","label":"Space Mono"}
    ]},
    {"id":"font-label","type":"enum","label":"Label font","default":"IBM Plex Mono","options":[
      {"value":"IBM Plex Mono","label":"IBM Plex Mono"},
      {"value":"JetBrains Mono","label":"JetBrains Mono"},
      {"value":"Space Mono","label":"Space Mono"},
      {"value":"Source Code Pro","label":"Source Code Pro"},
      {"value":"Inter","label":"Inter"},
      {"value":"Montserrat","label":"Montserrat"},
      {"value":"Outfit","label":"Outfit"},
      {"value":"Poppins","label":"Poppins"},
      {"value":"Oswald","label":"Oswald"}
    ]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* The runtime owns the --color-* variables; the script resolves them against the theme into --sc-* */
      :root {
        --color-ground: #050608;
        --color-ink: #f2f4f7;
        --color-muted: #8b929c;
        --color-accent: #ff2d3d;
        --sc-ground: var(--color-ground);
        --sc-ink: var(--color-ink);
        --sc-muted: var(--color-muted);
        --sc-accent: var(--color-accent);
        --sc-font: "Inter";
        --sc-font-label: "IBM Plex Mono";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--sc-ground);
      }
      #root {
        width: 100%;
        height: 100%;
        background: var(--sc-ground);
        font-family: var(--sc-font), sans-serif;
      }
      #card {
        position: absolute;
        inset: 0;
      }
      #sc-inner {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 72px;
        padding: 0 160px;
      }
      #sc-num {
        display: flex;
        flex: none;
        font-size: 400px;
        font-weight: 900;
        letter-spacing: -0.05em;
        color: var(--sc-accent);
        font-variant-numeric: lining-nums tabular-nums;
      }
      .sc-mask {
        height: 1em;
        line-height: 1em;
        overflow: hidden;
      }
      .sc-col div {
        height: 1em;
      }
      #sc-text {
        flex: 0 1 1000px;
        min-width: 0;
      }
      #sc-kicker {
        font-family: var(--sc-font-label), monospace;
        font-size: 32px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--sc-muted);
        margin-bottom: 20px;
      }
      #sc-title {
        font-size: 96px;
        font-weight: 800;
        line-height: 1.02;
        letter-spacing: -0.03em;
        color: var(--sc-ink);
      }
      #sc-title span {
        display: inline-block;
        margin-right: 0.24em;
      }
      /* Names every font option so the compiler bundles it; the variables pick one at runtime. */
      #sc-fonts {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
        opacity: 0;
      }
      #sc-fonts .f1 { font-family: "Inter"; }
      #sc-fonts .f2 { font-family: "Montserrat"; }
      #sc-fonts .f3 { font-family: "Outfit"; }
      #sc-fonts .f4 { font-family: "Poppins"; }
      #sc-fonts .f5 { font-family: "Nunito"; }
      #sc-fonts .f6 { font-family: "Roboto"; }
      #sc-fonts .f7 { font-family: "Oswald"; }
      #sc-fonts .f8 { font-family: "League Gothic"; }
      #sc-fonts .f9 { font-family: "Archivo Black"; }
      #sc-fonts .f10 { font-family: "Playfair Display"; }
      #sc-fonts .f11 { font-family: "EB Garamond"; }
      #sc-fonts .f12 { font-family: "JetBrains Mono"; }
      #sc-fonts .f13 { font-family: "Space Mono"; }
      #sc-fonts .f14 { font-family: "IBM Plex Mono"; }
      #sc-fonts .f15 { font-family: "Source Code Pro"; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.2" data-width="1920" data-height="1080">
      <div id="card">
        <div id="sc-inner">
          <div id="sc-num" data-layout-allow-overflow></div>
          <div id="sc-text">
            <div id="sc-kicker">Step 1 of 4</div>
            <div id="sc-title"></div>
          </div>
        </div>
      </div>
      <div id="sc-fonts" data-layout-ignore aria-hidden="true">
        <span class="f1">0</span><span class="f2">0</span><span class="f3">0</span><span class="f4">0</span><span class="f5">0</span><span class="f6">0</span><span class="f7">0</span><span class="f8">0</span><span class="f9">0</span><span class="f10">0</span><span class="f11">0</span><span class="f12">0</span><span class="f13">0</span><span class="f14">0</span><span class="f15">0</span>
      </div>
    </div>
    <script>
      (function () {
        const DARK = { "color-ground": "#050608", "color-ink": "#f2f4f7", "color-muted": "#8b929c", "color-accent": "#ff2d3d" };
        const LIGHT = { "color-ground": "#f5f4f0", "color-ink": "#0c0e12", "color-muted": "#6a707a", "color-accent": "#e11d2e" };

        const root = document.getElementById("root");
        const v = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
        const number = Math.max(1, Math.round(Number(v.number ?? 1)));
        const total = Math.round(Number(v.total ?? 4));
        const label = v.label ?? "Step {n} of {total}";
        const title = v.title ?? "Change weak & reused passwords";
        const duration = Math.max(1, Number(root.getAttribute("data-duration")) || 3.2);

        // Palette: a colour still at its (dark) default follows the theme, anything else wins
        const palette = v.theme === "light" ? LIGHT : DARK;
        const css = document.documentElement.style;
        Object.keys(DARK).forEach((id) => {
          const value = v[id] && String(v[id]).toLowerCase() !== DARK[id] ? v[id] : palette[id];
          css.setProperty(id.replace("color-", "--sc-"), value);
        });
        const font = `"${v.font || "Inter"}"`;
        const fontLabel = `"${v["font-label"] || "IBM Plex Mono"}"`;
        css.setProperty("--sc-font", font);
        css.setProperty("--sc-font-label", fontLabel);

        document.getElementById("sc-kicker").textContent = label.replace(/\{n\}/g, number).replace(/\{total\}/g, total);

        // Title split into words for the per-word entrance
        const titleEl = document.getElementById("sc-title");
        titleEl.textContent = "";
        const words = title.split(/\s+/).filter(Boolean).map((w) => {
          const s = document.createElement("span");
          s.textContent = w;
          titleEl.appendChild(s);
          return s;
        });

        // Each digit is a column that rolls down through the previous digits and lands on its value
        const ROLL = 8;
        const numEl = document.getElementById("sc-num");
        const cols = String(number).padStart(2, "0").split("").map((ch) => {
          const d = Number(ch);
          const mask = document.createElement("div");
          mask.className = "sc-mask";
          mask.setAttribute("data-layout-ignore", "");
          const col = document.createElement("div");
          col.className = "sc-col";
          for (let i = 0; i < ROLL; i++) {
            const cell = document.createElement("div");
            cell.textContent = (d - i + 100) % 10;
            col.appendChild(cell);
          }
          mask.appendChild(col);
          numEl.appendChild(mask);
          return col;
        });

        // Largest title size (MAX..MIN) that fits in MAX_LINES with no word wider than the column
        function fitTitle() {
          const MAX = 112, MIN = 56, MAX_LINES = 3;
          const width = titleEl.clientWidth;
          for (let size = MAX; size >= MIN; size -= 4) {
            titleEl.style.fontSize = `${size}px`;
            const lines = Math.round(titleEl.scrollHeight / (size * 1.02));
            if (lines <= MAX_LINES && words.every((w) => w.offsetWidth <= width)) return;
          }
        }

        function build() {
          fitTitle();

          const HOLD = 0.2; // last 6 frames still, so the hard cut lands on a still frame
          const push = Math.min(0.04, 0.012 * duration);
          const tl = gsap.timeline({ paused: true });
          cols.forEach((col, i) => {
            tl.fromTo(col, { yPercent: -(100 * (ROLL - 1)) / ROLL, filter: "blur(10px)" }, { yPercent: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, 0.04 + i * 0.08);
          });
          tl.fromTo("#sc-kicker", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 0.25);
          tl.fromTo("#sc-title span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" }, 0.4);
          // Elastic hold: slow push-in across the whole clip
          tl.fromTo("#sc-inner", { scale: 1 }, { scale: 1 + push, duration: Math.max(0.1, duration - HOLD), ease: "sine.inOut" }, 0);

          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
        }

        Promise.all([
          document.fonts.load(`900 400px ${font}`),
          document.fonts.load(`800 96px ${font}`),
          document.fonts.load(`500 32px ${fontLabel}`),
        ])
          .catch(() => {})
          .then(() => document.fonts.ready)
          .then(build);
      })();
    </script>
  </body>
</html>
